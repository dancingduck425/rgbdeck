[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rgbdeck"
version = "1.2.3"
description = "Standalone RGB lighting control for keyboards, mice and motherboards (own drivers, direct hidraw)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-only" }
authors = [{ name = "dancingduck425" }]
keywords = ["rgb", "lighting", "logitech", "glorious", "asus aura", "hidraw", "hidapi", "linux", "windows"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
dependencies = ["PySide6>=6.5", "hidapi>=0.15; sys_platform != 'linux'"]

[project.optional-dependencies]
evdev = ["evdev>=1.6"]        # only adds extra key-code names; the common keys are built in

[project.scripts]
rgbdeck = "rgbdeck.app:main_entry"

[project.urls]
Source = "https://github.com/dancingduck425/rgbdeck"

[tool.setuptools.packages.find]
include = ["rgbdeck*"]

[tool.setuptools.package-data]
rgbdeck = ["data/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E402", "E701", "E702", "E731", "B007", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E", "F", "B"]
