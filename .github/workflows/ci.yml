name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 > /dev/null
          python -m pip install --upgrade pip
          python -m pip install ruff .
      - name: Lint
        run: ruff check rgbdeck tests
      - name: Byte-compile & import
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q rgbdeck tests
          python -c "import rgbdeck.app, rgbdeck.backend, rgbdeck.effects, rgbdeck.hw.logitech_hidpp, rgbdeck.hw.glorious_gmow, rgbdeck.hw.asus_aura_usb; print('imports ok')"
      - name: Unit tests (no hardware)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/unit_test.py
