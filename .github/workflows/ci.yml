name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          # the package mirrors are unreachable from the runners now and then: try a few times before giving up
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 > /dev/null; then
              break
            fi
            [ "$attempt" = 5 ] && exit 1
            sleep 45
          done
          python -m pip install --upgrade pip
          python -m pip install ruff .
      - name: Lint & format
        run: |
          ruff check rgbdeck tests tools packaging
          ruff format --check rgbdeck tests tools packaging
      - name: Byte-compile & import
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q rgbdeck tests
          python -c "import rgbdeck.app, rgbdeck.backend; from rgbdeck.backend import discover_drivers; mods=discover_drivers(); print('drivers:', [m.__name__ for m in mods]); assert len(mods) >= 3"
      - name: Unit tests (no hardware)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for t in tests/unit*.py; do echo "== $t"; python "$t" || exit 1; done

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
      - name: Unit tests (no hardware)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for t in tests/unit*.py; do echo "== $t"; python "$t" || exit 1; done
      - name: Version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import rgbdeck; print(rgbdeck.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Build RGBDeck.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name RGBDeck
          --icon rgbdeck/data/rgbdeck.ico --add-data "rgbdeck/data;rgbdeck/data"
          --collect-submodules rgbdeck --hidden-import hid --hidden-import PySide6.QtBluetooth packaging/windows/launcher.py
      - name: Smoke-test the exe
        shell: bash
        run: |
          rm -rf "$APPDATA/rgbdeck"
          rc=0
          ./dist/RGBDeck.exe --selftest || rc=$?
          echo "--- log"; cat "$APPDATA/rgbdeck/rgbdeck.log"
          grep -q "selftest: OK" "$APPDATA/rgbdeck/rgbdeck.log" && [ "$rc" = 0 ]
      - name: Start, second start, stuck copy, Quit
        shell: pwsh
        run: python tests\e2e_windows_start.py dist\RGBDeck.exe
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} packaging\windows\rgbdeck.iss
          Get-ChildItem dist
      - name: Update window, start to finish
        # not on a release tag: its own downloads are not attached yet, so there is nothing to update to
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          RGBDECK_GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\RGBDeck-Setup-*.exe)[0].FullName
          python tests\e2e_windows_update.py $setup dist\RGBDeck.exe
      - uses: actions/upload-artifact@v4
        with:
          name: RGBDeck-windows-${{ steps.ver.outputs.version }}
          path: |
            dist/RGBDeck.exe
            dist/RGBDeck-Setup-*.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/RGBDeck.exe dist/RGBDeck-Setup-*.exe --clobber
